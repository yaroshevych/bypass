name: Go CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal evals)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test debug build
        run: go test -tags=debug ./internal/ui ./cmd/bypass
