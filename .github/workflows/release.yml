name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release archives
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build, smoke-test, and package all targets
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            export GOOS GOARCH CGO_ENABLED=0
            make build VERSION="$VERSION"

            if [[ "$target" == darwin/arm64 ]]; then
              version_output="$(./bin/bypass --version)"
              test "$version_output" = "bypass $VERSION"
              ./bin/bypass --help >/dev/null
            fi

            cp bin/bypass dist/stage/bypass
            tar -C dist/stage -czf "dist/bypass_${VERSION}_${GOOS}_${GOARCH}.tar.gz" bypass
          done

      - name: Upload release archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bypass-release-archives
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-web:
    name: Build and test web viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set release version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          printf 'BYPASS_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Build and test offline viewer
        run: npm test

      - name: Prepare release asset
        run: cp dist/index.html dist/bypass-web.html

      - name: Upload web release asset
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bypass-web-release
          path: web/dist/bypass-web.html
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: bypass-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz bypass-web.html > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create --repo "$GITHUB_REPOSITORY" "$TAG" dist/* "${args[@]}"

  update-homebrew:
    name: Update Homebrew tap
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: homebrew-tap-bypass
      cancel-in-progress: false
    steps:
      - name: Check out Bypass
        uses: actions/checkout@v6.1.0
      - name: Check out tap
        uses: actions/checkout@v6.1.0
        with:
          repository: yaroshevych/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Download published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo yaroshevych/bypass --dir release-assets
      - name: Verify release and update formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/update-homebrew.py "$TAG" release-assets homebrew-tap/Formula/bypass.rb
          ruby -c homebrew-tap/Formula/bypass.rb
      - name: Commit and push formula
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/bypass.rb; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/bypass.rb
          git commit -m "Update bypass to ${GITHUB_REF_NAME}"
          git push
