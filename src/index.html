<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; font-src data:; base-uri 'none'; form-action 'none'">
<title>bypass-web</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main id="unlock-screen" class="unlock">
  <section class="card" data-slot="card" aria-labelledby="unlock-title">
    <h1 id="unlock-title">bypass-web</h1>
    <p class="muted">Open a KeePass database on this device.</p>
    <form id="unlock-form" autocomplete="off">
      <fieldset id="credentials">
        <label class="drop" id="drop">KeePass database
          <input data-slot="input" id="vault-file" type="file" accept=".kdbx">
          <small id="file-hint">Choose or drop a .kdbx file</small>
        </label>
        <div class="stack">
          <label for="master">Master password</label>
          <div class="inline">
            <input data-slot="input" id="master" type="password" autocomplete="off" spellcheck="false">
            <button data-slot="button" id="show-master" type="button" aria-controls="master" aria-label="Show master password" aria-pressed="false">Show</button>
          </div>
        </div>
        <label>Keyfile <small>Optional</small>
          <input data-slot="input" id="key-file" type="file">
        </label>
        <button data-slot="button" class="primary" id="unlock-button" type="submit">Unlock vault</button>
      </fieldset>
      <p id="progress" role="status"></p>
      <p id="error" role="alert"></p>
    </form>
  </section>
</main>
<main id="viewer" class="viewer" hidden>
  <aside id="navigation-sidebar" class="sidebar" data-slot="sidebar" data-side="left" aria-label="Vault navigation">
    <div class="sidebar-header" data-slot="sidebar-header">
      <h1>
        <button id="vault-switcher" class="vault-switcher" type="button" popovertarget="vault-menu" aria-controls="vault-menu" aria-expanded="false">
          <span class="vault-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="7" width="18" height="14" rx="2"></rect>
              <path d="M7 3h10M5 5h14"></path>
            </svg>
          </span>
          <span id="vault-name"></span>
          <svg class="vault-chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 10 5-5 5 5m-10 4 5 5 5-5"></path>
          </svg>
        </button>
      </h1>
    </div>
    <nav id="groups" class="pane sidebar-content" data-slot="sidebar-content" aria-label="Vault views, tags and groups"></nav>
  </aside>
  <header class="vault-header">
    <div class="toolbar">
      <button data-slot="button" id="commands" type="button">Commands</button>
      <div class="flex items-center gap-2"><span class="muted" id="theme-label">Dark mode</span><button data-slot="switch" id="theme" class="theme-switch" type="button" role="switch" aria-checked="false" aria-labelledby="theme-label"><span data-slot="switch-thumb" aria-hidden="true"></span></button></div>
    </div>
  </header>
  <div class="workspace-bar">
    <div id="tabs" data-slot="tabs-list" role="tablist" aria-label="Vault views"></div>
    <label class="search-control"><span class="sr-only">Search entries</span>
      <input data-slot="input" id="search" type="search" placeholder="Filter entries" autocomplete="off" spellcheck="false">
    </label>
  </div>
  <section class="pane entry-pane" aria-label="Entries">
    <table class="entry-table" data-slot="table" aria-label="Vault entries">
      <thead data-slot="table-header">
        <tr data-slot="table-row">
          <th scope="col" data-slot="table-head">Title</th>
          <th scope="col" data-slot="table-head">Username</th>
          <th scope="col" data-slot="table-head">Website</th>
        </tr>
      </thead>
      <tbody id="entries" data-slot="table-body"></tbody>
    </table>
  </section>
  <div class="entry-sidebar-controls">
    <button data-slot="sidebar-trigger" type="button" aria-controls="navigation-sidebar" aria-expanded="true" aria-label="Toggle navigation sidebar" title="Toggle navigation sidebar">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <path d="M9 3v18"></path>
      </svg>
    </button>
    <button data-slot="sidebar-trigger" type="button" aria-controls="detail" aria-expanded="true" aria-label="Toggle details sidebar" title="Toggle details sidebar">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <path d="M15 3v18"></path>
      </svg>
    </button>
  </div>
  <aside class="pane sidebar stack" id="detail" data-slot="sidebar" data-side="right" aria-label="Entry details"></aside>
  <div id="vault-menu" class="vault-menu" data-slot="dropdown-menu-content" popover aria-label="Vault actions">
    <button id="open-another" data-slot="dropdown-menu-item" type="button" autofocus>Open another…</button>
    <button id="lock" data-slot="dropdown-menu-item" type="button">Lock Vault</button>
  </div>
  <p id="copy-status" class="sr-only" role="status"></p>
  <p id="result-count" class="sr-only" role="status"></p>
  <section id="palette" class="overlay" role="dialog" aria-modal="true" aria-labelledby="palette-title" hidden>
    <div class="overlay-card" data-slot="dialog-content">
      <div class="palette-header" data-slot="dialog-header">
        <h2 id="palette-title">Command palette</h2>
        <button data-slot="button" id="palette-close" type="button" aria-label="Close command palette"><span aria-hidden="true">×</span></button>
      </div>
      <div class="palette-command" data-slot="command">
        <input data-slot="command-input" id="palette-search" type="search" aria-label="Search commands" placeholder="Search commands" autocomplete="off">
        <div id="palette-items" data-slot="command-list" class="command-list"></div>
      </div>
    </div>
  </section>
  <section id="field-jump" class="overlay" role="dialog" aria-modal="true" aria-labelledby="jump-title" tabindex="-1" hidden><div class="overlay-card" data-slot="dialog-content"><h2 id="jump-title">Jump to field</h2><p>p Password · u Username · w URL · n Notes · e Email</p></div></section>
  <section id="large-view" class="overlay" role="dialog" aria-modal="true" aria-labelledby="large-title" hidden><div class="overlay-card" data-slot="dialog-content"><h2 id="large-title">Large View</h2><pre id="large-content"></pre><button data-slot="button" id="large-close" type="button">Close</button></div></section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
